<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Stamporama">
  <!-- The home-screen icon's maskable variant (#2002): src/app/icon.svg's stamp mark on an opaque
       white square, shrunk to sit inside Android's safe zone (the centre circle, 80% across — the mark is 54% wide, its corners inside the circle) so the
       launcher's mask never cuts into it. The PNG beside it is rendered from this file:
       rsvg-convert -w 512 -h 512 public/phone-icon-maskable.svg -o public/phone-icon-maskable-512.png -->
  <rect width="64" height="64" fill="#fff" />
  <g transform="translate(32 32) scale(0.72) translate(-32 -32)">
  <mask id="perforation">
    <rect x="8" y="8" width="48" height="48" rx="2" fill="#fff" />
    <g fill="#000">
      <circle cx="11" cy="8" r="3" /><circle cx="17" cy="8" r="3" /><circle cx="23" cy="8" r="3" /><circle cx="29" cy="8" r="3" /><circle cx="35" cy="8" r="3" /><circle cx="41" cy="8" r="3" /><circle cx="47" cy="8" r="3" /><circle cx="53" cy="8" r="3" />
      <circle cx="11" cy="56" r="3" /><circle cx="17" cy="56" r="3" /><circle cx="23" cy="56" r="3" /><circle cx="29" cy="56" r="3" /><circle cx="35" cy="56" r="3" /><circle cx="41" cy="56" r="3" /><circle cx="47" cy="56" r="3" /><circle cx="53" cy="56" r="3" />
      <circle cx="8" cy="11" r="3" /><circle cx="8" cy="17" r="3" /><circle cx="8" cy="23" r="3" /><circle cx="8" cy="29" r="3" /><circle cx="8" cy="35" r="3" /><circle cx="8" cy="41" r="3" /><circle cx="8" cy="47" r="3" /><circle cx="8" cy="53" r="3" />
      <circle cx="56" cy="11" r="3" /><circle cx="56" cy="17" r="3" /><circle cx="56" cy="23" r="3" /><circle cx="56" cy="29" r="3" /><circle cx="56" cy="35" r="3" /><circle cx="56" cy="41" r="3" /><circle cx="56" cy="47" r="3" /><circle cx="56" cy="53" r="3" />
    </g>
  </mask>
  <rect x="8" y="8" width="48" height="48" rx="2" fill="#0f766e" mask="url(#perforation)" />
  <!-- The "S", drawn as a stroked path rather than text so no font has to be present. -->
  <path d="M 36.95 20.05 A 7 7 0 1 0 32 32 A 7 7 0 1 1 27.05 43.95"
        fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" />
  </g>
</svg>
