# Production / self-hosting stack for Stamporama.
#
# This file is meant to run a pre-built image from GitHub Container Registry on a
# target server (for example a Raspberry Pi). It does NOT build anything locally
# and does NOT run a database — the operator provides an external PostgreSQL via
# DATABASE_URL in the sibling .env file.
#
# You should never need to edit this file. All configuration lives in .env.
# The install script at scripts/install.sh sets this up for you.

services:
  app:
    image: ghcr.io/michalwy/stamporama:${TAG:-latest}
    command: sh -c "pnpm prisma:migrate:deploy && pnpm start"
    env_file:
      - .env
    ports:
      - "${STAMPORAMA_HTTP_PORT:-3000}:3000"
    # Persistent storage for uploaded photos (#112). The app writes image bytes under
    # STAMPORAMA_DATA_DIR (default /data); this named volume keeps them across container
    # restarts and image updates. Back it up alongside your database — losing it loses the
    # images.
    volumes:
      - stamporama-data:/data
      # Google Cloud Storage backend (#138, optional): mount your service-account key read-only
      # and set GOOGLE_APPLICATION_CREDENTIALS + STAMPORAMA_GCS_* in .env. The stamporama-data
      # volume above can be dropped once all photos are migrated (pnpm photos:migrate:gcs).
      # - /secrets/gcs-key.json:/secrets/gcs-key.json:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # There is no auto-update service any more (#2690, ADR-0083): Watchtower is unmaintained, and
  # updating is scripts/update.sh, run by hand or from the host's cron or a systemd timer. An .env
  # that still says COMPOSE_PROFILES=autoupdate keeps working — no service uses that profile, so
  # compose starts the app as usual; scripts/update.sh and scripts/install.sh clear it and remove a
  # leftover Watchtower container.

volumes:
  # Uploaded photo bytes (#112). Persists across restarts and image updates.
  stamporama-data:
