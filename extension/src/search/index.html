<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Find in Stamporama</title>
    <style>
      /* Deliberately the match and capture windows' own palette and controls: the three windows are
         one tool wearing three faces, and this one is reached from a fourth gesture again. */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --border: #e5e7eb;
        --panel: #f9fafb;
        --sunk: #f3f4f6;
        --primary: #2563eb;
        --primary-fg: #ffffff;
        --danger: #dc2626;
        --warn: #b45309;
        --ok: #15803d;
        --trade: #7c3aed;
        /* Every hue above again, as **text on a panel**. In light mode they are the same colours —
           they were picked to be read on white — which is exactly why the pair has to exist: on a
           dark panel a colour chosen for white is a colour at the wrong end of the scale, and
           lifting `--primary` itself is not open to us because it is also the Search button's fill,
           under white text. So a chip, a border and a word take the `-on-panel` variable and only a
           filled control takes the base one. */
        --primary-on-panel: var(--primary);
        --danger-on-panel: var(--danger);
        --warn-on-panel: var(--warn);
        --ok-on-panel: var(--ok);
        --trade-on-panel: var(--trade);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #ececec;
          --muted: #9ca3af;
          --border: #3a3a3a;
          --panel: #262626;
          --sunk: #1a1a1a;
          --primary: #3b82f6;
          /* The read-on-a-panel end of each hue, lifted to the 300 step: at the 600–700 the light
             palette uses, a catalog chip or a *For sale* mark on #262626 is a shape you can see and
             a word you cannot read — and these are the smallest text in the window. */
          --primary-on-panel: #93c5fd;
          --danger-on-panel: #fca5a5;
          --warn-on-panel: #fcd34d;
          --ok-on-panel: #6ee7b7;
          --trade-on-panel: #c4b5fd;
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        min-width: 380px;
        font-family: system-ui, -apple-system, sans-serif;
        /* One step up from the 14px the other two Assistant windows set. Those are read once, at a
           decision; this one is a list scanned against a listing on the screen behind it, going
           back and forth between the two, and every figure on a row is small print by design. */
        font-size: 15px;
        background: var(--bg);
        color: var(--fg);
      }
      /* Wider than the one-line-per-row window this started as: a row now carries a thumbnail, a
         line of catalog chips and a line of axis chips, and at 720px the chips wrapped onto three
         lines each. The window itself (`SEARCH_WINDOW_WIDTH`) is sized to match. */
      .pad { padding: 20px 24px 32px; max-width: 1000px; margin: 0 auto; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      .badge {
        display: flex; flex-direction: column; gap: 2px;
        padding: 8px 10px; border-radius: 8px;
        background: var(--panel); border: 1px solid var(--border);
        border-left: 5px solid var(--accent, var(--border));
        margin-bottom: 12px;
      }
      .badge .top { display: flex; align-items: center; gap: 8px; }
      .badge .dot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; background: var(--accent, var(--muted)); }
      .badge .name { font-weight: 600; flex: 1; min-width: 0; }
      .badge .url { color: var(--muted); font-size: 12px; word-break: break-all; }
      .badge.none { color: var(--warn-on-panel); }
      .badge.none .dot { display: none; }
      .badge select {
        font: inherit; font-size: 12px; max-width: 260px;
        padding: 3px 6px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      }
      /* The query, always editable: what came off the page is a proposal, and refining it here is
         the whole difference between this and a search that has to be started again. */
      .ask { display: flex; gap: 8px; margin-bottom: 10px; }
      .ask input {
        font: inherit; flex: 1; min-width: 0; padding: 7px 9px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      }
      button {
        font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--border); background: var(--panel); color: var(--fg);
      }
      button.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
      button:disabled { opacity: 0.5; cursor: default; }
      .status { color: var(--muted); min-height: 16px; margin: 4px 0 10px; }
      .status.err { color: var(--danger-on-panel); }
      section { margin-bottom: 18px; }
      section h2 {
        font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
        color: var(--muted); margin: 0 0 6px; font-weight: 600;
      }
      .rows { display: flex; flex-direction: column; gap: 8px; }
      a.row {
        display: flex; align-items: flex-start; gap: 12px; text-decoration: none; color: inherit;
        padding: 11px 13px; border-radius: 8px;
        border: 1px solid var(--border); background: var(--panel);
      }
      a.row:hover { border-color: var(--primary-on-panel); }
      .row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
      /* The name, and only where there is one — an unnamed stamp draws no line at all rather than a
         placeholder. The catalog chips above are the identity; the name is what is added to it. */
      .row .title { font-weight: 600; word-break: break-word; }
      .row .sub { font-size: 13px; color: var(--muted); word-break: break-word; }
      .row .nums { font-variant-numeric: tabular-nums; }
      /* The stamp's picture as a fixed left column, as every list row in the app has it (#137), and
         **fitting** rather than cropping (#525): a stamp is the subject of its thumbnail, and a crop
         hides exactly what it is looked at for — a margin, a perforation, an overprint at the edge.
         The column is kept even when a row has no picture, so the text of every row lines up. */
      .thumb {
        flex: 0 0 auto; width: 68px; height: 68px; border-radius: 6px;
        background: var(--sunk); border: 1px solid var(--border);
        object-fit: contain; display: block;
      }
      /* Catalog numbers as the chips the app's lists draw them with, the area's primary catalog
         first and louder: three catalogues' numbers side by side read as "1B, 39, 1" and name none
         of them (#357), and which one a collector thinks in is the one their catalogue names. */
      .cats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
      .cat {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; color: var(--muted);
        border: 1px solid var(--border); border-radius: 4px;
        padding: 2px 6px; white-space: nowrap;
      }
      .cat.primary {
        font-size: 13px; font-weight: 600;
        color: var(--primary-on-panel); border-color: var(--primary-on-panel);
      }
      /* Everything a row says about *its own* kind of entry: a want's acceptance, a copy's
         condition. Separated from the identity above it, so the two are never read as one line. */
      .facts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 2px; }
      /* An axis value as a short chip — `MNH`, `PC`, `Pair` — with the full name on hover. The three
         axes are told apart by **shape, not colour**: colour already means priority on a want row
         and disposition on a copy row, and a third meaning on it would leave none of them readable.
         Condition is filled (it is the axis a bid is decided on), certificate outlined, format
         dashed. */
      .axis {
        font-size: 12px; border-radius: 999px; padding: 2px 9px; white-space: nowrap;
        border: 1px solid var(--border); color: var(--fg);
      }
      .axis.condition { background: var(--sunk); font-weight: 600; }
      .axis.certificate { color: var(--muted); }
      .axis.format { color: var(--muted); border-style: dashed; }
      /* How many are held — the answer the menu entry was clicked for, so it sits at the end of the
         row where the eye lands after the name, and says "Not held" rather than going quiet. */
      .held {
        flex: 0 0 auto; font-size: 13px; font-weight: 600;
        padding: 3px 9px; border-radius: 999px;
        background: var(--sunk); color: var(--muted); border: 1px solid var(--border);
      }
      .held.yes { color: var(--ok-on-panel); border-color: currentColor; }
      /* The marks column: on a want row, the priority above what is already held; on a copy row, the
         copy number above what the copy is for. Facts stacked rather than run together, because
         holding a copy does not close a want, and a copy's number is not its disposition. */
      .marks { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
      /* Disposition chips wrap rather than stack: a copy is routinely both kept and for sale, and
         three stacked chips would make a copy row twice the height of a stamp row. */
      .marks .chips { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
      /* The inventory row's own three hues (#99), so a copy reads the same here as it does in the
         app: green for kept, blue for sale, purple for trade. */
      .disp {
        font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
        border: 1px solid currentColor; background: var(--sunk); white-space: nowrap;
      }
      .disp.collection { color: var(--ok-on-panel); }
      .disp.sale { color: var(--primary-on-panel); }
      .disp.trade { color: var(--trade-on-panel); }
      /* The priority chip, coloured by the want's own rank: amber for high (chasing this first is an
         intention, not a fault), blue for normal, muted for low. */
      .want {
        font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
        border: 1px solid currentColor; color: var(--muted); background: var(--sunk);
        white-space: nowrap;
      }
      .want.high { color: var(--warn-on-panel); }
      .want.normal { color: var(--primary-on-panel); }
      /* A want row is edged in its priority, so the section reads as a list of decisions rather than
         a list of rows that happen to be first. */
      a.row.want-row { border-left: 4px solid var(--warn-on-panel); }
      a.row.want-row.normal { border-left-color: var(--primary-on-panel); }
      a.row.want-row.low { border-left-color: var(--border); }
      .lede { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="pad">
      <h1>Find in Stamporama</h1>

      <div class="badge none" id="badge">
        <div class="top">
          <span class="dot"></span>
          <span class="name" id="badgeName">No active profile</span>
          <select id="profileSelect" hidden></select>
        </div>
        <div class="url" id="badgeUrl"></div>
      </div>

      <form class="ask" id="ask">
        <input
          id="query"
          type="search"
          autocomplete="off"
          placeholder="A catalog number, a name, a shelf reference…"
          aria-label="What to look for"
        />
        <button class="primary" id="run" type="submit">Search</button>
      </form>

      <div class="status" id="status"></div>
      <!-- Said before any row is read: whether anything here is on the want list. It is the reason
           the window was opened, and it must not need scrolling to find. -->
      <div class="status lede" id="lede" hidden></div>

      <!-- First, always: what is still being looked for. It is the reason the window is opened, and
           a want found by scrolling past the stamps is a want found too late. -->
      <section id="wantsSection" hidden>
        <h2>On your want list</h2>
        <div class="rows" id="wants"></div>
      </section>

      <!-- Then what is in hand. "Have I got this?" is the question the menu entry is clicked with,
           and a copy is the only row that answers it outright — a stamp row answers it by counting.
           The catalogue entries follow, and the sets they belong to last. -->
      <section id="copiesSection" hidden>
        <h2>Copies</h2>
        <div class="rows" id="copies"></div>
      </section>

      <section id="stampsSection" hidden>
        <h2>Stamps</h2>
        <div class="rows" id="stamps"></div>
      </section>

      <section id="issuesSection" hidden>
        <h2>Issues</h2>
        <div class="rows" id="issues"></div>
      </section>
    </div>
    <script src="search.js"></script>
  </body>
</html>
