<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stamporama Assistant</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --border: #e5e7eb;
        --panel: #f9fafb;
        --sunk: #f3f4f6;
        --primary: #2563eb;
        --primary-fg: #ffffff;
        --danger: #dc2626;
        --warn: #b45309;
        --ok: #15803d;
        --scrim: rgba(0, 0, 0, 0.45);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #ececec;
          --muted: #9ca3af;
          --border: #3a3a3a;
          --panel: #262626;
          --sunk: #1a1a1a;
          --primary: #3b82f6;
          --scrim: rgba(0, 0, 0, 0.6);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        /* Hosted as a standalone window (opened centred by the service worker), so the layout is
           fluid rather than the cramped fixed width a toolbar popup forces. */
        min-width: 380px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        background: var(--bg);
        color: var(--fg);
      }
      .pad { padding: 20px 24px 32px; max-width: 1240px; margin: 0 auto; }
      h1 { font-size: 17px; margin: 0 0 12px; }
      /* The target badge. Always visible, and always carrying the active profile's own colour (derived
         from the instance + collection it points at) — the whole point is that you cannot mistake
         which instance a write is about to land on. */
      .badge {
        display: flex; flex-direction: column; gap: 2px;
        padding: 8px 10px; border-radius: 8px;
        background: var(--panel); border: 1px solid var(--border);
        border-left: 5px solid var(--accent, var(--border));
        margin-bottom: 10px;
      }
      .badge .top { display: flex; align-items: center; gap: 8px; }
      .badge .dot {
        flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%;
        background: var(--accent, var(--muted));
      }
      .badge .name { font-weight: 600; flex: 1; min-width: 0; }
      .badge .url { color: var(--muted); font-size: 12px; word-break: break-all; }
      .badge.none { color: var(--warn); }
      .badge.none .dot { display: none; }
      .badge select {
        font: inherit; font-size: 12px; max-width: 260px;
        padding: 3px 6px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      }
      .badge select[hidden] { display: none; }
      .scan {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 8px 10px; margin-bottom: 8px;
        border: 1px solid var(--border); border-radius: 8px; background: var(--sunk);
      }
      .scan .found { font-weight: 600; }
      .scan.empty .found { font-weight: 400; color: var(--muted); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
      button {
        font: inherit; padding: 6px 10px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--border); background: var(--panel); color: var(--fg);
      }
      button.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
      button.small { padding: 3px 8px; font-size: 12px; }
      button:disabled { opacity: 0.5; cursor: default; }

      .progress { height: 4px; border-radius: 999px; background: var(--sunk); overflow: hidden; margin-bottom: 8px; }
      .progress .bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.15s ease; }
      .status { color: var(--muted); min-height: 16px; margin: 4px 0 8px; }
      .status.err { color: var(--danger); }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
      .chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
      .chip.auto { background: rgba(21,128,61,0.15); color: var(--ok); }
      .chip.needs { background: rgba(180,83,9,0.15); color: var(--warn); }

      /* Section headings carry a coloured band and stick to the top while their cards scroll past,
         so the list never leaves you wondering which group you are looking at. The accent repeats
         the tag colour of the rows underneath (amber = decide, green = will write, grey = done). */
      .sec { margin-bottom: 22px; }
      .sec > .hdr, details.sec > summary {
        position: sticky; top: 0; z-index: 2;
        display: flex; align-items: center; gap: 8px;
        padding: 7px 10px; margin-bottom: 10px;
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
        color: var(--fg); background: var(--sunk);
        border: 1px solid var(--border); border-left: 4px solid var(--accent, var(--border));
        border-radius: 6px;
      }
      details.sec > summary { cursor: pointer; }
      /* A flex summary drops the native marker, so the chevron is drawn here and follows the state. */
      details.sec > summary::before { content: "▸"; font-size: 10px; color: var(--muted); }
      details.sec[open] > summary::before { content: "▾"; }

      .sec.needs { --accent: var(--warn); }
      .sec.will { --accent: var(--ok); }
      .sec.done, .sec.skip { --accent: var(--muted); }
      .sec.done > .hdr, details.sec.skip > summary, details.sec.done > summary { color: var(--muted); }

      /* How many rows the section holds, and — when it holds work — what that work is. */
      .sec .cnt {
        font-size: 11px; font-weight: 700; letter-spacing: 0;
        padding: 1px 7px; border-radius: 999px;
        background: var(--panel); border: 1px solid var(--border); color: var(--muted);
      }
      .sec .add {
        font-size: 11px; font-weight: 600; letter-spacing: 0; text-transform: none;
        padding: 1px 8px; border-radius: 999px;
        background: rgba(21,128,61,0.15); color: var(--ok);
      }

      .item {
        border: 1px solid var(--border); border-radius: 8px;
        margin-bottom: 12px; background: var(--panel); overflow: hidden;
      }
      /* With room to spare, put the Colnect item and the stamp it resolved to side by side so the
         "this ↔ that" reading is immediate. Falls back to stacked on a narrow window. */
      @media (min-width: 720px) {
        .item { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; }
        /* Needs to out-specify `.side.match`'s stacked-layout top border, which is defined later. */
        .item > .side.match { border-top: none; border-left: 1px solid var(--border); }
      }
      .tag { font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
      .tag.auto { background: rgba(21,128,61,0.15); color: var(--ok); }
      .tag.needs { background: rgba(180,83,9,0.15); color: var(--warn); }
      .tag.skip { background: rgba(107,114,128,0.15); color: var(--muted); }

      /* Both columns share one skeleton — label, then picture + the same four lines — so the two
         sides can be read across, line against line. */
      .side { padding: 14px 16px; }
      .side.match { background: var(--sunk); border-top: 1px solid var(--border); }
      /* The label lives inside the text column, beside the picture rather than above it, so the
         picture gets the row's full height. */
      .side .lbl {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
        color: var(--muted); display: flex; align-items: center; gap: 8px;
        margin-bottom: 6px; flex-wrap: wrap;
      }
      /* Top-aligned, not centred: both columns start with a label on the same baseline, so anchoring
         the pictures to the top keeps the two thumbnails level whatever the text under them runs to.
         Centring drifts them apart as soon as one side has more lines than the other. */
      .body { display: flex; align-items: flex-start; gap: 14px; }
      .body + .body { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
      .grow { flex: 1; min-width: 0; }
      .body .nm { font-weight: 600; line-height: 1.35; }
      .body .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .body .cats { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
      .body .meta { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.45; }

      /* Thumbnails: fixed box, letterboxed, so rows stay aligned whatever the image aspect.
         An absent picture keeps its slot, so both columns' lines stay on the same baseline. */
      .thumb {
        flex: 0 0 auto; width: 116px; height: 116px; object-fit: contain;
        background: var(--sunk); border: 1px solid var(--border); border-radius: 4px;
      }
      .thumb--none { border-style: dashed; opacity: 0.5; }
      .side.match .thumb { background: var(--panel); }

      /* Catalog numbers, marked by what each one means. */
      .ref {
        font-family: monospace; font-size: 12px; padding: 1px 6px; border-radius: 4px;
        border: 1px solid transparent; white-space: nowrap;
      }
      .ref.only-mine { background: var(--panel); border-color: var(--border); color: var(--muted); }
      .ref.matched { background: rgba(21,128,61,0.16); border-color: rgba(21,128,61,0.35); color: var(--ok); font-weight: 600; }
      .ref.missing { background: rgba(37,99,235,0.14); border-color: rgba(37,99,235,0.35); color: var(--primary); }
      .ref.conflict { background: rgba(220,38,38,0.14); border-color: rgba(220,38,38,0.35); color: var(--danger); }
      .ref.unmapped, .ref.unknown { color: var(--muted); border-color: var(--border); }
      .ref.unmapped { opacity: 0.6; }
      /* A number the backfill (#280) would add to our stamp — dashed, because it isn't ours yet. */
      .ref.fill {
        background: rgba(21,128,61,0.08); border-color: rgba(21,128,61,0.45);
        border-style: dashed; color: var(--ok);
      }
      .ref.fill.done { border-style: solid; background: rgba(21,128,61,0.16); font-weight: 600; }

      .fills { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
      .nofill { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.45; }
      .opt { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .opt input { margin: 0; }

      .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
      .legend .ref { font-family: inherit; }

      .warnline { color: var(--warn); font-size: 12px; margin-top: 4px; }
      .empty { color: var(--muted); margin-top: 10px; }

      /* Above everything, the sticky section headings included — they carry a z-index of their own
         and would otherwise paint over the scrim and the dialog. */
      .overlay {
        position: fixed; inset: 0; z-index: 100; background: var(--scrim);
        display: flex; align-items: center; justify-content: center; padding: 16px;
      }
      .overlay[hidden] { display: none; }
      .box {
        background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
        padding: 14px; max-width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      }
      .box .msg { margin-bottom: 12px; line-height: 1.45; }
      .box .target { font-weight: 600; word-break: break-all; }
      .box .acts { display: flex; gap: 8px; justify-content: flex-end; }
    </style>
  </head>
  <body>
    <div class="pad">
      <h1>Stamporama Assistant</h1>
      <div id="badge" class="badge none">
        <div class="top">
          <span class="dot"></span>
          <span id="badgeName" class="name">No active profile</span>
          <select id="profileSelect" title="Active profile — where matches are written" hidden></select>
          <button id="openOptions" class="small">Options</button>
        </div>
        <span id="badgeUrl" class="url">Add one in Options, then click the toolbar icon again.</span>
      </div>

      <div id="scan" class="scan empty">
        <span id="found" class="found">Scanning page…</span>
      </div>

      <div class="row">
        <button id="writeAuto" class="primary" disabled>Write auto-matches</button>
        <label class="opt" title="Add catalog numbers Colnect lists for catalogs your stamp has none of. Existing numbers are never overwritten.">
          <input type="checkbox" id="backfill" checked />
          Fill missing catalog numbers
        </label>
      </div>

      <div id="progress" class="progress" hidden><div id="bar" class="bar"></div></div>
      <div id="status" class="status"></div>
      <div id="chips" class="chips" hidden></div>
      <div id="legend" class="legend" hidden>
        <span><span class="ref matched">Mi 1</span> same on both sides</span>
        <span><span class="ref missing">Sn 2</span> only on Colnect — you keep this catalog</span>
        <span><span class="ref conflict">Yt 3</span> the two sides differ</span>
        <span><span class="ref only-mine">Fi 4</span> only on your stamp</span>
        <span><span class="ref unmapped">AFA 5</span> catalog you don't keep</span>
        <span><span class="ref fill">+ Sn·PL 6</span> will be added to your stamp</span>
      </div>
      <div id="results"></div>
    </div>

    <div id="overlay" class="overlay" hidden>
      <div class="box">
        <div id="confirmMsg" class="msg"></div>
        <div class="acts">
          <button id="confirmCancel">Cancel</button>
          <button id="confirmOk" class="primary">Confirm</button>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
