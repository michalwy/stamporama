name: Closing references

# `Refs #NNN`, never a closing keyword — the convention of #785 turned into a control (#790).
#
# **Its own workflow, and not a job in `ci.yml`, because of the trigger** (#935). This check reads
# the pull request's *body*, and a body is edited without a push. `ci.yml` takes the default
# `pull_request` types — `opened`, `synchronize`, `reopened` — and a body edit is `edited`, so while
# the job lived there its green described the body as it stood at the last push. That happened, on
# #976: pushed, green, body edited, no re-run. The tick looked exactly like one earned by the body a
# reviewer was reading, and in the direction that matters the failure is silent — an edit that
# *adds* a closing keyword left a green required check beside it.
#
# `edited` could not simply be added to `ci.yml`, for two reasons:
#
#   - every job there would start on a typo fix in a title, and `Detect changes` cannot gate a body
#     edit away — the files did not change, so it answers with whatever they were;
#   - **`ci.yml`'s `concurrency` cancels a pull request's run in progress**, so an edit made while
#     the full suite was running would kill that run and replace it with one that had nothing to do
#     with the edit. A separate file is a separate workflow name and therefore a separate
#     concurrency group, and an edit costs this one job and nothing else.
#
# **The required context is the job's `name:`, not this file.** `main`'s ruleset
# (`.github/rulesets/main.json`) names `Closing reference check` and pins no workflow and no app,
# so the job moved here without the ruleset changing. That makes the `name:` below load-bearing:
# rename it and every pull request waits for ever on a context nothing reports.
#
# **No `paths:` and no job-level `if:`, ever.** `ci.yml` explains the first at length: a workflow
# that does not start reports nothing, and a required context that never arrives leaves a pull
# request pending for ever. The second is subtler and specific to `edited`. It is tempting to skip
# title-only edits with `if: github.event.changes.body`, since a title arms nothing under rebase
# merge. **Do not.** A job skipped by `if:` still reports its context as *skipped*, GitHub counts
# a skipped required check as satisfied, and that new check run replaces the previous one on the
# same head commit — so a red check on an armed body would turn green on the next title edit, with
# the body still armed. The job runs on every event in the list; it costs seconds.
#
# **Deliberately independent of `Detect changes`.** Every application job asks "does this change
# touch the application"; this one asks what the pull request *says*, which is independent of
# which files it touches. Both of the incidents that produced it were documentation-only pull
# requests — squarely inside what `Detect changes` gates away.
#
# **What remains is a window of seconds**, between an edit landing and this workflow's run being
# queued. A required check that is pending blocks a merge, so the window only matters if the other
# required checks finish inside it with auto-merge armed. `docs/agents/collaboration.md` keeps the
# read-back of `closingIssuesReferences` after an edit for that reason, and because the read-back
# is what the reviewer can see without opening a log.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Granted per job.
permissions: {}

# One run per pull request at a time; a newer event supersedes an older run. Nothing is lost by
# cancelling: the script reads the body and the commits live through the API, not from the event,
# so the run that survives is also the one that reads the latest state.
concurrency:
  group: closing-refs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A closing keyword hands the close to GitHub at merge time, which is the human step that
  # `docs/agents/collaboration.md` deliberately puts *after* verification. #783 merged with a
  # closing reference in its body and closed #780 one second later, before anybody had read that
  # issue's *Done when*; #787 — the pull request that added the rule — armed one twice from its
  # own body, once while quoting the first mistake in order to explain it. The rule survived
  # careful attention only sometimes, which is the definition of something that needs a machine.
  #
  # **It checks the pull request, not just the diff**, because a body edited after the last push
  # changes GitHub's answer without changing a commit — which is also why it re-runs on `edited`
  # (above). Two sources, and they need different
  # instruments:
  #
  #   - the **body**, read through `closingIssuesReferences` — GitHub's own parse of what it will
  #     act on at merge time. No regular expression can beat it, and one would be actively worse:
  #     GitHub ignores a keyword inside a code span, so a body that safely quotes the trap in
  #     order to warn about it would fail a text search and merge cleanly here.
  #   - the **commit messages**, matched by pattern, because `closingIssuesReferences` does not
  #     see them. This repository rebase-merges, so every commit message on the branch lands on
  #     `main` verbatim and closes whatever it names, whatever the body says.
  #
  # The whole check was measured before it was trusted, by running this exact script against every
  # one of the **130 pull requests** in this repository's history: it passes 129 and fails exactly
  # one — #783, the pull request that closed #780 by accident. The commit pattern was measured the
  # same way over all **971 commits** on `main`: 49 hits, every one a genuine `Closes #NNN` from
  # the era when commits went straight to `main`, and no false positives. The `(#NNN)` suffix a
  # commit title already uses does not match, and neither does `Refs #NNN`.
  #
  # Renovate is safe: it renders `#595` in upstream release notes as `#&#8203;595`, a zero-width
  # space that stops GitHub parsing it, and its commit messages are a single `chore(deps):` line.
  # All 80 of its pull requests here pass this check. That matters because a
  # dependency batch merges itself with nobody watching, so a check that failed one would stop an
  # automerge silently — the exact failure mode `collaboration.md` warns about for that whole
  # arrangement.
  #
  # **It fails closed.** If the API cannot be reached the check reports red, because green here
  # means "safe to merge" and an unanswered question is not that. `Detect changes` in `ci.yml` fails
  # the other way for the opposite reason: its safe direction is to run more, not less.
  #
  # No checkout and no `contents:` scope — nothing is read from the tree — so the job answers in
  # seconds and is cheap enough to be a required check.
  closing-refs:
    name: Closing reference check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Granted here rather than at the top of the workflow:
    # `pull-requests: read` for the pull request and its commits, `issues: read` for the linked
    # issues behind `closingIssuesReferences`.
    permissions:
      issues: read
      pull-requests: read

    steps:
      - name: Check whether merging this pull request would close an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # close/closes/closed, fix/fixes/fixed, resolve/resolves/resolved, followed by an issue
          # in any form GitHub accepts: `#12`, `GH-12`, `owner/repo#12`, or the full issue URL.
          keywords='\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*(#|GH-|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#|https?://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/)[0-9]+'

          fail_closed() {
            echo "::error::$1 — this check cannot tell whether the pull request would close an issue, so it reports red. Re-run it."
            exit 1
          }

          if ! body_refs=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
                --json closingIssuesReferences \
                --jq '[.closingIssuesReferences[].number] | map("#" + tostring) | join(", ")'); then
            fail_closed "Could not read the pull request's closing references"
          fi

          if ! commit_messages=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/commits" \
                --jq '.[] | .sha[0:8] as $sha | .commit.message | split("\n")[] | "\($sha) \(.)"'); then
            fail_closed "Could not list the pull request's commits"
          fi

          commit_hits=$(printf '%s\n' "$commit_messages" | grep -iE "$keywords" || true)

          if [ -z "$body_refs" ] && [ -z "$commit_hits" ]; then
            echo "No closing reference — merging this pull request closes nothing."
            exit 0
          fi

          if [ -n "$body_refs" ]; then
            echo "The body is armed to close: $body_refs"
          fi
          if [ -n "$commit_hits" ]; then
            echo "Commit messages carrying a closing keyword:"
            printf '%s\n' "$commit_hits" | sed 's/^/  /'
          fi

          cat <<'EOF'

          Reference the issue as `Refs #NNN` instead. Merging closes it otherwise, at the merge
          timestamp, before anybody has verified anything — that is how #780 was closed before
          anybody had read its "Done when" (docs/agents/collaboration.md, "Refs #NNN, never a
          closing keyword").

          Prose counts. GitHub matches close/closes/closed, fix/fixes/fixed and
          resolve/resolves/resolved wherever they land, so an ordinary sentence that happens to
          put the verb in front of the number arms it just as well as a reference line does — and
          so does a sentence quoting the mistake in order to warn about it. Rewrite it so the verb
          and the number are not adjacent: "the reviewer closes it" and "#780" in one sentence
          is fine.

          A parenthetical asking GitHub not to does not help; GitHub does not read parentheticals.

          To fix: edit the pull request body, or amend the commit message and force-push, then
          re-run this check. Read the result back rather than the text —
          `gh pr view <n> --json closingIssuesReferences` must return `[]`.
          EOF

          echo "::error::Merging this pull request would close an issue. Reference it as 'Refs #NNN' instead — see this job's log."
          exit 1
