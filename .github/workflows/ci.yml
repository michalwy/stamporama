name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://stamporama:stamporama@localhost:5433/stamporama_test
  BETTER_AUTH_URL: http://127.0.0.1:3000
  BETTER_AUTH_SECRET: stamporama-ci-auth-secret-value

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run unit tests
        run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stamporama
          POSTGRES_PASSWORD: stamporama
          POSTGRES_DB: stamporama_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stamporama -d stamporama_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Run integration tests
        run: pnpm exec tsx --tsconfig tests/integration/tsconfig.json --test tests/integration/**/*.test.ts

  # The extension is a separate workspace package, excluded from the app's lint/typecheck. Its own
  # checks run here — notably the packaging tests (#288), whose output would otherwise only fail
  # later, on upload to the store or in review.
  extension:
    name: Extension checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @stamporama/assistant typecheck

      - name: Test
        run: pnpm --filter @stamporama/assistant test

      - name: Build
        run: pnpm --filter @stamporama/assistant build

  # Publish the extension to its unlisted Chrome Web Store listing on release tags (#288). The
  # store assigns the identity and signs the package, so there is nothing to bake into the image and
  # nothing for the app to serve — this job is the whole distribution path.
  #
  # It can only *update* an item that already exists: the listing, its Privacy tab and its unlisted
  # visibility are set up by hand once, and publishing keeps whatever visibility is configured there.
  #
  # Gated on the `CWS_PUBLISH_ENABLED` repository variable, because the store refuses an upload while
  # a previous version of the item is still in review — and app releases must not wait on that. Set
  # it to `true` once the listing is settled; anything else skips the job entirely.
  publish-extension:
    name: Publish extension (Chrome Web Store)
    runs-on: ubuntu-latest
    needs: [static-checks, unit, integration, extension]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && vars.CWS_PUBLISH_ENABLED == 'true'
    timeout-minutes: 10

    env:
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The packaged version mirrors the app release. The store rejects an upload whose version did
      # not increase, so cutting a release is what makes a new version publishable.
      - name: Build the store package
        run: pnpm assistant:zip --version "${GITHUB_REF_NAME#v}"

      - name: Upload and publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          for name in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_PUBLISHER_ID CWS_EXTENSION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set — see extension/README.md (Publishing)."
              exit 1
            fi
          done

          # Every call reports its own status and prints the body when it goes wrong. Letting curl
          # fail the step instead loses the response, and a bare "error: 400" says nothing about
          # whether the token was rejected or the store refused the package.
          call() {
            local description=$1 expected=$2
            shift 2
            local response status body
            response=$(curl -sS -w $'\n%{http_code}' "$@")
            status=${response##*$'\n'}
            body=${response%$'\n'*}
            if [ "$status" != "$expected" ]; then
              echo "::error::$description failed with HTTP $status"
              echo "$body"
              return 1
            fi
            printf '%s' "$body"
          }

          # Access tokens live an hour; the refresh token is the long-lived credential. It expires
          # every 7 days while the OAuth consent screen sits in "Testing" — publish that app.
          token=$(call "Token exchange" 200 https://oauth2.googleapis.com/token \
            -d "client_id=$CWS_CLIENT_ID" \
            -d "client_secret=$CWS_CLIENT_SECRET" \
            -d "refresh_token=$CWS_REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | jq -r .access_token)

          base="https://chromewebstore.googleapis.com"
          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"

          # A previous version still in review makes this fail — that is the store's rule, not a
          # broken pipeline, and the printed body says so.
          upload=$(call "Upload" 200 -X POST \
            -H "Authorization: Bearer $token" \
            -T extension/dist-store/stamporama-assistant.zip \
            "$base/upload/v2/$item:upload")
          echo "$upload" | jq .
          # A rejected package can still answer 200 — the verdict is in uploadState, not the status.
          if [ "$(echo "$upload" | jq -r '.uploadState // empty')" != "SUCCESS" ]; then
            echo "::error::Upload rejected by the Chrome Web Store."
            exit 1
          fi

          call "Publish" 200 -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Length: 0" \
            "$base/v2/$item:publish" | jq .

          echo "::notice::Submitted for review. It goes live once the store approves it."

  # Build each architecture on its own native runner and push by digest. Emulating
  # arm64 via QEMU used to deadlock `pnpm install` for hours; native runners avoid it.
  build-image:
    name: Build image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [static-checks, unit, integration, extension]
    # Publish only for release tags (vX.Y.Z) — never for every main commit or PRs.
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Prepare platform slug
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image labels and version
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STAMPORAMA_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the per-architecture digests into a single multi-arch manifest and tag it.
  publish-image:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: [build-image]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
