name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on pull requests only. A run on `main` or on a release tag is never
# cancelled: it is the only record that the commit somebody tagged, released and deployed actually
# passed its checks, and a later push must not delete it. Seven of the last forty runs were
# cancelled this way before this exception existed — every one of them on `main`, including the
# `chore: bump version to 0.129.0` commit that v0.129.0 was cut from.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://stamporama:stamporama@localhost:5433/stamporama_test
  BETTER_AUTH_URL: http://127.0.0.1:3000
  BETTER_AUTH_SECRET: stamporama-ci-auth-secret-value

jobs:
  # One cheap job that always runs and decides whether this change touches anything the
  # application is built from. The four required jobs below are gated on its output, so a
  # documentation-only change leaves them skipped and the pull request is mergeable in seconds
  # rather than the fifteen minutes the full suite costs (#798).
  #
  # **The gate is a job-level `if:`, never `paths-ignore` at the workflow level.** `main` requires
  # four status checks by name — `Static checks`, `Unit tests`, `Integration tests`,
  # `Extension checks` (`docs/agents/collaboration.md`) — and a workflow that does not run reports
  # none of them: the pull request would sit on four `expected` contexts for ever, with nothing
  # able to merge it short of taking the rule off the repository. A job skipped by `if:` still
  # reports its context, and GitHub counts a skipped required check as satisfied. That difference
  # is the whole design, and it is the one thing here that must not be "simplified" back into a
  # `paths-ignore:`.
  #
  # The safe list is a **whitelist**, and it is a whitelist on purpose: `package.json`,
  # `pnpm-lock.yaml`, `Dockerfile`, `prisma/**`, `.github/**`, the compose files and `scripts/**`
  # must all run everything, and a blacklist is exactly how one of them eventually gets forgotten.
  # `extension/**` is application code too — only `extension/*.md` is documentation, and it
  # already matches the `*.md` rule.
  #
  # Anything this job cannot answer confidently — an unknown event, a missing base commit, an API
  # call that failed, an empty file list — runs the full suite. Get that backwards and the failure
  # is silent: a detection that always answers "documentation" looks exactly like a very fast CI.
  #
  # The tag-only jobs (`Build image (…)`, `Publish container image`,
  # `Publish extension (Chrome Web Store)`) are deliberately **not** gated on this job. A tag runs
  # everything anyway, and a second condition on top of theirs is an easy way to make a release
  # quietly skip its image.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `contents: read` is the workflow default and is what `compare/<before>...<after>` needs.
    # Listing a pull request's files is a separate scope, and without it the API answers 403 —
    # which the step survives by running the full suite, so the cost of getting this wrong is
    # silent: every documentation pull request would quietly pay for the whole suite and nothing
    # would look broken. The scope is granted here rather than at the top of the workflow, so no
    # other job gains it.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}

    steps:
      - name: Decide whether this change touches the application
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          everything() {
            echo "$1"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A release builds everything, with no cleverness and no exceptions.
          case "$GITHUB_REF" in
            refs/tags/*) everything "Tag build - running the full suite." ;;
          esac

          # A rename reports the new path as `filename` and the old one as `previous_filename`.
          # Both are consulted: moving `src/lib/thing.ts` to `docs/thing.md` changes the
          # application, and only the second field says so.
          case "$EVENT_NAME" in
            pull_request)
              if ! files=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
                    --jq '.[] | .filename, (.previous_filename // empty)'); then
                everything "Could not list the pull request's files - running the full suite."
              fi
              ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                everything "No previous commit to compare against - running the full suite."
              fi
              if ! files=$(gh api "repos/$REPOSITORY/compare/$BEFORE...$AFTER" \
                    --jq '.files[]? | .filename, (.previous_filename // empty)'); then
                everything "Could not compare $BEFORE...$AFTER - running the full suite."
              fi
              ;;
            *)
              everything "Event $EVENT_NAME carries no diff - running the full suite."
              ;;
          esac

          if [ -z "$files" ]; then
            everything "No changed files reported - running the full suite."
          fi

          echo "Changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'

          # The question is "is this change documentation only", not "does it contain
          # documentation": one application file anywhere in the diff runs everything. The
          # patterns are shell `case` globs, where `*` crosses a `/` — so `docs/*` covers
          # `docs/agents/albums.md` and `*.md` covers `extension/README.md`.
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              *.md|docs/*|.claude/*) continue ;;
            esac
            everything "$file is not documentation - running the full suite."
          done <<EOF
          $files
          EOF

          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "Documentation only - the application suite is skipped."

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run unit tests
        run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stamporama
          POSTGRES_PASSWORD: stamporama
          POSTGRES_DB: stamporama_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stamporama -d stamporama_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      # The pattern is **quoted**, so it reaches the Node test runner intact and that runner's own
      # glob — which does understand `**` — selects the files. Unquoted it worked only by
      # accident, and the accident is worth stating because the obvious "tidy-up" is to take the
      # quotes back off (#880).
      #
      # A `run:` block is `bash -e` with `globstar` **off**, where `**` is simply `*`. So
      # `tests/integration/**/*.test.ts` means `tests/integration/*/*.test.ts`, which today
      # matches nothing — every test file sits directly in `tests/integration/`, and the one
      # subdirectory, `shims/`, holds no test. Matching nothing, bash leaves the word alone and
      # the runner receives the pattern it wanted all along.
      #
      # **The day somebody groups these tests into folders, that stops being true**: with one
      # `tests/integration/<dir>/x.test.ts` present, the shell expands to that single argument and
      # this step runs *one* file out of 142 — and reports `Integration tests` green. A required
      # check that silently stopped running 141 files looks exactly like a fast one.
      # `scripts/e2e-db.sh` quotes its own copy for this reason; the two now agree.
      - name: Run integration tests
        run: pnpm exec tsx --tsconfig tests/integration/tsconfig.json --test 'tests/integration/**/*.test.ts'

  # The extension is a separate workspace package, excluded from the app's lint/typecheck. Its own
  # checks run here — notably the packaging tests (#288), whose output would otherwise only fail
  # later, on upload to the store or in review.
  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @stamporama/assistant typecheck

      - name: Test
        run: pnpm --filter @stamporama/assistant test

      - name: Build
        run: pnpm --filter @stamporama/assistant build

  # Publish the extension to its unlisted Chrome Web Store listing on release tags (#288). The
  # store assigns the identity and signs the package, so there is nothing to bake into the image and
  # nothing for the app to serve — this job is the whole distribution path.
  #
  # It can only *update* an item that already exists: the listing, its Privacy tab and its unlisted
  # visibility are set up by hand once, and publishing keeps whatever visibility is configured there.
  #
  # Gated on the `CWS_PUBLISH_ENABLED` repository variable, because the store refuses an upload while
  # a previous version of the item is still in review — and app releases must not wait on that. Set
  # it to `true` once the listing is settled; anything else skips the job entirely.
  #
  # Runnable by hand on a release tag (`gh workflow run CI --ref vX.Y.Z`), so a submission the store
  # refused — or a release cut while the switch was off — is retried without moving the tag, which
  # would rebuild and re-push the images for a release that already shipped.
  publish-extension:
    name: Publish extension (Chrome Web Store)
    runs-on: ubuntu-latest
    needs: [static-checks, unit, integration, extension]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.CWS_PUBLISH_ENABLED == 'true'
    timeout-minutes: 10

    env:
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        # Full history and tags: the job diffs `extension/` against the release the store already
        # holds, which is a tag that may be many releases back.
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The packaged version mirrors the app release. The store rejects an upload whose version did
      # not increase, so cutting a release is what makes a new version publishable.
      - name: Build the store package
        run: pnpm assistant:zip --version "${GITHUB_REF_NAME#v}"

      - name: Upload and publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          for name in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_PUBLISHER_ID CWS_EXTENSION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set — see extension/README.md (Publishing)."
              exit 1
            fi
          done

          # Every call reports its own status and prints the body when it goes wrong. Letting curl
          # fail the step instead loses the response, and a bare "error: 400" says nothing about
          # whether the token was rejected or the store refused the package.
          call() {
            local description=$1 expected=$2
            shift 2
            local response status body
            response=$(curl -sS -w $'\n%{http_code}' "$@")
            status=${response##*$'\n'}
            body=${response%$'\n'*}
            if [ "$status" != "$expected" ]; then
              echo "::error::$description failed with HTTP $status"
              echo "$body"
              return 1
            fi
            printf '%s' "$body"
          }

          # Access tokens live an hour; the refresh token is the long-lived credential. It expires
          # every 7 days while the OAuth consent screen sits in "Testing" — publish that app.
          token=$(call "Token exchange" 200 https://oauth2.googleapis.com/token \
            -d "client_id=$CWS_CLIENT_ID" \
            -d "client_secret=$CWS_CLIENT_SECRET" \
            -d "refresh_token=$CWS_REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | jq -r .access_token)

          base="https://chromewebstore.googleapis.com"
          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"

          # Most releases change nothing under extension/, and every submission costs a review the
          # store makes users wait through. So compare against what the store already holds — the
          # newer of its published and its in-review revision, since a version still with the
          # reviewers already carries whatever change we would be sending again.
          #
          # The baseline is the store's, not "the previous tag", so the check heals itself: a
          # release whose submission failed, or was cut while CWS_PUBLISH_ENABLED was off, is still
          # picked up by the next one.
          status=$(call "Status" 200 -H "Authorization: Bearer $token" "$base/v2/$item:fetchStatus")
          echo "$status" | jq .
          known=$(echo "$status" | jq -r '
            [.publishedItemRevisionStatus, .submittedItemRevisionStatus]
            | map(select(. != null) | .distributionChannels[]?.crxVersion // empty)
            | .[]' | sort -V | tail -n1)

          if [ -n "$known" ] && git rev-parse -q --verify "refs/tags/v$known" >/dev/null; then
            baseline="v$known"
          else
            # No tag for what the store reports (a hand-uploaded package, or an item with nothing
            # published yet). Fall back to the previous release: publishing once too often is the
            # harmless direction, skipping is the one that loses a change.
            # `|| true`: with no other release tag at all, grep selects nothing and pipefail would
            # otherwise fail the step over an empty baseline the next line already handles.
            baseline=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$GITHUB_REF_NAME" | head -n1 || true)
            echo "::warning::No tag matches the store version '${known:-none}' — comparing against ${baseline:-nothing} instead."
          fi

          # Only what the ZIP is built from counts. The package is `dist-release/`, so this
          # extension's docs and its unit tests never reach a user, and a change to them must not
          # cost a store review. (The wildcards match across directories — a pathspec without
          # `:(glob)` magic lets `*` cross a `/`, so `extension/*.md` also excludes `src/**/*.md`.)
          shipped=(extension/ ':(exclude)extension/*.md' ':(exclude)extension/*.test.ts')
          if [ -n "$baseline" ] && git diff --quiet "$baseline" "$GITHUB_REF_NAME" -- "${shipped[@]}"; then
            echo "::notice::Nothing shipped in extension/ changed since $baseline — nothing to submit."
            exit 0
          fi

          # A previous version still in review makes this fail — that is the store's rule, not a
          # broken pipeline, and the printed body says so.
          upload=$(call "Upload" 200 -X POST \
            -H "Authorization: Bearer $token" \
            -T extension/dist-store/stamporama-assistant.zip \
            "$base/upload/v2/$item:upload")
          echo "$upload" | jq .
          # A rejected package can still answer 200 — the verdict is in uploadState, not the status.
          # This API (v2) says SUCCEEDED where the old v1.1 endpoint said SUCCESS; both are accepted,
          # because failing a good upload leaves the draft sitting in the store unpublished.
          state=$(echo "$upload" | jq -r '.uploadState // empty')
          case "$state" in
            SUCCESS | SUCCEEDED) ;;
            *)
              echo "::error::Upload rejected by the Chrome Web Store (uploadState: ${state:-none})."
              exit 1
              ;;
          esac

          call "Publish" 200 -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Length: 0" \
            "$base/v2/$item:publish" | jq .

          echo "::notice::Submitted for review. It goes live once the store approves it."

  # Build each architecture on its own native runner and push by digest. Emulating
  # arm64 via QEMU used to deadlock `pnpm install` for hours; native runners avoid it.
  build-image:
    name: Build image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [static-checks, unit, integration, extension]
    # Publish only for release tags (vX.Y.Z) — never for every main commit or PRs.
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Prepare platform slug
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image labels and version
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # `created` is the instant this build started, ISO-8601 UTC — the same value the OCI
          # label carries, so the date shown in the UI (#507) and the one on the image agree.
          build-args: |
            STAMPORAMA_VERSION=${{ steps.meta.outputs.version }}
            STAMPORAMA_BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the per-architecture digests into a single multi-arch manifest and tag it.
  publish-image:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: [build-image]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
