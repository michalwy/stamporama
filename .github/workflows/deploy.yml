name: Deploy

# A published release deploys to the owner's Raspberry Pi (#2689, ADR-0083). The runbook — the
# runner, the `prod` environment, the fork-approval setting, the first deploy, rollback and restoring
# a dump — is `docs/deployment/pi-deploy.md`; the steps themselves are `scripts/deploy.sh`.
#
# **This is the only workflow allowed onto a self-hosted runner**, and that is enforced:
# `scripts/check-self-hosted-runners.mjs`, run by `tests/unit/self-hosted-runners.test.ts`, fails
# when any other workflow could reach one. The repository is public, and a job on the Pi's runner
# executes whatever its commit says on the machine that holds the production `.env`. So the
# triggers below are the whole of the safety argument and `tests/unit/deploy-workflow.test.ts` pins
# them: a release being published, or somebody with write access starting it by hand — **never**
# `pull_request`, `pull_request_target` or `workflow_call`, nothing a fork can start.
#
# The owner's decisions (2026-11-22), recorded in #2689, are what let this file name deployment
# credentials and triggers at all; a change to either needs the owner again (`docs/agents/merge-checklist.md`).

on:
  # The release procedure publishes the Release only after the tag's own CI run is green and has
  # published the image (`docs/agents/release-versioning.md`), so the image exists when this starts.
  release:
    types: [published]
  # A redeploy or a rollback. A manual run is the one way past the no-downgrade guard.
  workflow_dispatch:
    inputs:
      version:
        description: "Release to deploy, e.g. 1.2.0 (an older one rolls back)"
        required: true
        type: string

permissions:
  contents: read

# One deploy at a time, and a second one **waits** rather than cancelling the first: a deploy
# cancelled halfway can leave a dump half-written or a container half-started.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the Pi
    if: github.repository == 'michalwy/stamporama'
    runs-on: [self-hosted, pi, stamporama]
    environment: prod
    timeout-minutes: 30

    steps:
      # Only the script. Its copy is the one at the ref this run is for: the release's tag, or the
      # branch a manual run was started from (the `prod` environment limits which, see the runbook).
      - name: Check out the deploy script
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts/deploy.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Values reach the script through `env:`, never by `${{ }}` inside `run:`, so a version string
      # cannot become shell. The script validates it as X.Y.Z.
      - name: Deploy
        env:
          STAMPORAMA_DIR: ${{ vars.STAMPORAMA_DIR }}
          STAMPORAMA_BACKUP_DIR: ${{ vars.STAMPORAMA_BACKUP_DIR }}
          STAMPORAMA_BACKUP_KEEP: ${{ vars.STAMPORAMA_BACKUP_KEEP }}
          # Where a stored feedback report is announced (#2721). The script writes both into the
          # installation's .env when both are set, and prints neither.
          FEEDBACK_NOTIFY_URL: ${{ vars.FEEDBACK_NOTIFY_URL }}
          FEEDBACK_NOTIFY_TOKEN: ${{ secrets.FEEDBACK_NOTIFY_TOKEN }}
          VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # An unset variable reaches the script as an empty string; empty means "use the default".
          [ -n "$STAMPORAMA_BACKUP_DIR" ] || unset STAMPORAMA_BACKUP_DIR
          [ -n "$STAMPORAMA_BACKUP_KEEP" ] || unset STAMPORAMA_BACKUP_KEEP
          args=(--version "$VERSION")
          if [ "$MANUAL" = "true" ]; then args+=(--allow-downgrade); fi
          bash scripts/deploy.sh "${args[@]}"
