name: Deploy

# Deploys the owner's Raspberry Pi (#2689, ADR-0083). Since 2026-11-27 the Pi follows `main`
# (#2712): every push to `main` whose CI is green publishes `main-<short sha>` and `ci.yml`'s
# `Deploy main to the Pi` job dispatches this workflow on `main` with that version. A release no longer
# deploys. The runbook — the runner, the `prod` environment, the fork-approval setting, rollback and
# restoring a dump — is `docs/deployment/pi-deploy.md`; the steps themselves are `scripts/deploy.sh`.
#
# **This is the only workflow allowed onto a self-hosted runner**, and that is enforced:
# `scripts/check-self-hosted-runners.mjs`, run by `tests/unit/self-hosted-runners.test.ts`, fails
# when any other workflow could reach one. The repository is public, and a job on the Pi's runner
# executes whatever its commit says on the machine that holds the production `.env`. So the
# trigger below is the whole of the safety argument and `tests/unit/deploy-workflow.test.ts` pins
# it: a dispatch, by somebody with write access or by `main`'s own CI run — **never**
# `pull_request`, `pull_request_target`, `workflow_call` or `push`, nothing a fork can start.
#
# The owner's decisions (2026-11-22 in #2689, 2026-11-27 in #2712) are what let this file name
# deployment credentials and triggers at all; a change to either needs the owner again
# (`docs/agents/merge-checklist.md`).

on:
  # `main`'s CI run after its image is published (`automatic`), or a redeploy or a rollback by hand.
  # A manual run is the one way past the no-downgrade guard.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy: main-<short sha> or a release X.Y.Z (an older one rolls back)"
        required: true
        type: string
      automatic:
        description: "Set by main's CI run; keeps the no-downgrade guard on. Leave it off by hand"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time, and a second one **waits** rather than cancelling the first: a deploy
# cancelled halfway can leave a dump half-written or a container half-started.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the Pi
    if: github.repository == 'michalwy/stamporama'
    runs-on: [self-hosted, pi, stamporama]
    environment: prod
    timeout-minutes: 30

    steps:
      # Only the script. Its copy is the one at the ref this run is for: `main`, or the tag a manual
      # run was started from (the `prod` environment limits which, see the runbook).
      - name: Check out the deploy script
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts/deploy.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Values reach the script through `env:`, never by `${{ }}` inside `run:`, so a version string
      # cannot become shell. The script validates it as X.Y.Z.
      - name: Deploy
        env:
          STAMPORAMA_DIR: ${{ vars.STAMPORAMA_DIR }}
          STAMPORAMA_BACKUP_DIR: ${{ vars.STAMPORAMA_BACKUP_DIR }}
          STAMPORAMA_BACKUP_KEEP: ${{ vars.STAMPORAMA_BACKUP_KEEP }}
          VERSION: ${{ inputs.version }}
          MANUAL: ${{ !inputs.automatic }}
        run: |
          set -euo pipefail
          # An unset variable reaches the script as an empty string; empty means "use the default".
          [ -n "$STAMPORAMA_BACKUP_DIR" ] || unset STAMPORAMA_BACKUP_DIR
          [ -n "$STAMPORAMA_BACKUP_KEEP" ] || unset STAMPORAMA_BACKUP_KEEP
          args=(--version "$VERSION")
          if [ "$MANUAL" = "true" ]; then args+=(--allow-downgrade); fi
          bash scripts/deploy.sh "${args[@]}"
