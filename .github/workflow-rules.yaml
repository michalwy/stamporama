# This project's self-report against dev-agent's estate rule set.
#
# dev-agent (`/Users/michalwy/dev-agent`) maintains `rules/INDEX.md` and generates its adoption
# matrix from this file. It never writes this file, and that is the point: a custodian authoring a
# project's self-report puts the claim back inside the trust boundary it exists to escape
# (`rules/ADOPTION.md`). The format is specified there, once, so that three projects do not each
# invent one.
#
# Every id in `rules/INDEX.md` gets an entry here, including the ones we do not have. An id left out
# renders as `?`, which says *nobody looked* — a different and worse state than `absent`.
#
# Every `status:` below was verified by grep against `main` rather than from recollection: this file
# is a claim, and R-002 applies to it like anything else. `where:` names the document a reader
# genuinely finds the rule in, not the place it happens to be true of us.
#
# Audited against dev-agent `447b5e6` (2026-09-08). The cards move underneath an audit, and moved
# five times during this one: R-005 and R-006 were written in `6f63045`, R-007 grew its
# merge-gating-settings clause in `2c1437e`, and R-004 and R-010 did not exist when the audit was
# briefed. `updated:` below dates this file, not the rule set it was read against, and nothing in
# the schema carries the latter — so re-read the cards before trusting a `status:` here, and treat
# a missing id as this file being behind rather than as a rule nobody has an opinion on.
#
# Update this file in the same commit that implements or diverges from a rule, never as a follow-up
# — a follow-up is a second chance to forget, and the gap it opens is invisible (#941).

schema: 1
project: stamporama
updated: 2026-09-08

rules:

  R-001:
    status: implemented
    where: >-
      AGENTS.md § Working Rules, and docs/agents/collaboration.md § "`Refs #NNN`, never a closing
      keyword"; enforced by the `Closing reference check` job in .github/workflows/ci.yml, a
