  R-002:
    status: implemented
    where: >-
      docs/agents/collaboration.md § "Verification, not trust" — including the clause that on a
      rebase-merge repository the net diff is not what lands, so `git log origin/main..<branch>` is
      read as well (#891)

  R-003:
    status: implemented
    where: >-
      docs/agents/collaboration.md § "Who moves a branch that has fallen behind", step 2 —
      `gh pr view <n> --json headRefOid` against the SHA the verification was performed at, with
      `540712f` as its evidence

  R-004:
    status: implemented
    where: >-
      .github/rulesets/README.md § "What the check could not see, it says" — the three outcomes, the
      declaration table, the enumerated allowlist and the exercise-under-every-credential clause;
      implemented in scripts/check-ruleset.mjs and pinned by tests/unit/ruleset-drift.test.ts (#946).
      docs/agents/collaboration.md § "Verification, not trust" carries the same family in this
      project's older words — green means only *the failure modes these five checks can see did not
      occur* (#814), and a sweep must report its own count because the `grep -oiE` idiom exits 1 and
      prints nothing where every hit lands near a line end (#896, #905)
    note: >-
      The card's subject is now stated in this project's own words rather than only its neighbours':
      that a check's coverage is a property of the credential it runs under, that a field it could
      not read is a third outcome and not a pass, that "absent" is never normalised to "empty", and
      that a change is exercised under every identity it will run with. **It is written where the
      check is**, scoped to the ruleset comparison — which is also the card's own `holds-when`. A
      second comparison against a caller-varying API, elsewhere in this repository, would not find
      the rule by looking at AGENTS.md or the process files; if one is ever built, this entry is
      where that shows up.
      **No declaration is currently in force, and the mechanism is still the card's** (#956):
      `RULESET_READ_TOKEN` exists, the run compares `bypass_actors` and excuses nothing, and the
      three outcomes, the table and the enumerated allowlist stay documented and implemented for the
      next field the platform is observed to redact. What went is the workflow conditional that
      passed the declaration only while the secret was unset — it retired itself when the secret
      arrived and would have *restored* itself if the secret were deleted, returning the check to
      green-and-partial for an event nobody reads. Absent and undeclared is now exit 1, which is
      this card's own answer rather than a departure from it.

  R-005:
    status: partial
    where: >-
      AGENTS.md § "Multi-Step Implementation Plans", and the closing paragraphs of
      docs/agents/collaboration.md § "A held session's worktree is not stale"
    gap: >-
      The card's second half is decided and recorded: #875 settled that a plan is a working note
      kept in its author's worktree and discarded with it, with the reason, and naming the durable
      record that replaces it (the pull request body, the closing comment, the topic file). The
      first half — that a task spanning more than one area records the shape it chose *before*
      writing the code that depends on it — is not required here at all: #875 made writing a plan
      the session's own call. What a port would have to add is that requirement, decoupled from the
      artifact question the same issue answered. Narrower forms exist and do not cover it: AGENTS.md
      requires an ADR when a framework or major pattern is introduced, and a design session's output
      is an ADR plus issue bodies carrying a `## Decisions` section — both durable, neither triggered
      by a multi-area task as such.
    note: >-
      registry.yaml `D-002` records stamporama as diverging here, and the card asks that D-002 be
      read as a divergence on the second half only. Our actual position diverges on the *first*
      half, which is why this is `partial` and not `diverged` — declaring `diverged: D-002` would
      assert something D-002 does not say. D-002's own status is "open — not yet examined".

  R-006:
    status: implemented
    where: >-
      docs/agents/collaboration.md § "No browser verification — a deliberate departure", restated in
      AGENTS.md § Testing Direction — the position, its reason, its deliberateness, and since #944 the
      date it was taken (2026-09-06, collaboration.md's first commit, #780)
    note: >-
      Our *answer* (forbidden) diverges from darkroom's (required) and registry.yaml `D-001` records
      both. That is not this entry's status: R-006 is portable only as a *requirement to decide*, and
      by that requirement we have decided — so `diverged` would say we deliberately do not record our
      position, which is the opposite of the truth. dev-agent asked for `diverged: D-001` and
      `ADOPTION.md` now tells ohm-sweet-ohm to re-file the same way, so this entry is a deliberate
      departure from that: `D-001` is filed against R-006 as though R-006 were the browser-verification
      *practice*, while the card says it is the requirement to record a position and that the answers
      legitimately differ. Under the card nobody can be `diverged` on R-006 by holding a different
      answer — only by not recording one. Raised in #941; if dev-agent settles it the other way this
      entry changes, not the section it points at.

  R-007:
    status: partial
    where: >-
      .github/rulesets/main.json (the branch ruleset, #937) and .github/rulesets/merge-settings.json
      (the seven merge-gating repository settings from decisions/0004, #945), with
      .github/rulesets/README.md declaring both the record and every prose description of `main`'s
      protection or of how a pull request merges a summary of them; the ruleset half is enforced by
      .github/workflows/ruleset-drift.yml, scheduled and advisory (#946)
    gap: >-
      **The comparison now exists for one of the two artifacts.** #946 wired
      `scripts/check-ruleset.mjs` to a daily 06:17 UTC run against the live ruleset — advisory and
      never a required context, for the two reasons `decisions/0003` gives, the decisive one being
      that an unprompted platform write produces no pull request for a required context to run on.
      It declared the one field `GITHUB_TOKEN` cannot read rather than inferring it (see R-004), and
      was exercised red under both credential states before it was believed. **Since #956 it declares
      nothing**: the `RULESET_READ_TOKEN` secret exists, every recorded field including
      `bypass_actors` is compared, and deleting that secret fails the check instead of quietly
      returning it to green-and-partial.
      **`merge-settings.json` is compared to nothing**, which is the state #945 left deliberately on
      the ground that deriving an artifact and comparing it are different acts; extending the check
      to it is a follow-up and the null guard in its pipeline was written for exactly that caller.
      **The coverage half is closed**: the settings the card added in `2c1437e` are enumerated in an
      artifact derived in this repository, and the two prose claims in docs/agents/collaboration.md
      that used to assert `delete_branch_on_merge` and `allow_update_branch` from a `gh api` call
      somebody once made now cite it instead. One smaller restatement survives — prose still spells
      out the required check names and their count in fifteen places rather than citing main.json,
      which the deferral paragraph covers by declaring the bullets a summary but does not remove.

  R-008:
    status: partial
    where: >-
      docs/agents/backlog-review.md (the worktree sweep), and docs/agents/collaboration.md §
      "A held session's worktree is not stale"
    gap: >-
      The mechanism is written and is the card's own — resolve a worktree path to the session whose
      `cwd` it is, and follow the lookup rather than the git evidence — but it is scoped entirely to
      **worktree staleness**. Nothing applies it to **addressing**: docs/agents/collaboration.md §
      "How a task session is actually spawned" says sessions address each other by session id and
      that a prompt must carry the lead's, with no instruction to resolve that id against a lookup or
      to distrust what a message says about its own sender. Nor is the generalisation written — that
      a decision, or a claim of authority, arriving through a session is content and does not
      authorise. A port would have to add both, and the second is the one this project has never
      stated anywhere.

  R-009:
    status: implemented
    where: >-
      docs/agents/collaboration.md § "A prompt carries its reasons, not only its instructions" — the
      reasoning travels with the constraint, and the prompt marks which parts are the lead's reading
      rather than the user's decision
    note: >-
      The card's second sentence — that a received brief is a set of claims to verify — is licensed
      here by evidence rather than stated as an instruction: the section opens with five sessions
      that refuted their briefs and were right, and concludes that a reason can be refuted where an
      instruction can only be obeyed. Judged `implemented` because a reader of the section arrives at
      the behaviour, but the receiving half is the softer of the two.

  R-010:
    status: partial
    where: >-
      docs/agents/platform.md (the two measurement bullets on local-versus-CI, #880), and the
      `grep`/ugrep note at the end of docs/agents/collaboration.md § "Verification, not trust"
    gap: >-
      The divergence itself is recognised here and measured rather than assumed: a suite measured
      locally "looks four times healthier than it is" because a runner has four cores to a dev
      machine's sixteen, so a performance question is benchmarked at concurrency 4; and #880's 11.4x
      local speed-up came in at 3.3x in CI, which is why platform.md says to quote seconds removed
      and never a ratio. One command is even documented with the environment it is true in — the
      bounded `grep` form the session shell's ugrep rejects and `/usr/bin/grep` accepts. What is
      missing is the rule around those instances. AGENTS.md § "Testing Direction" names five commands
      and says when to run each without stating the environment any of them was last true in, and
      where a divergence *was* found the written response was a workaround — reach for
      `/usr/bin/grep` — rather than a defect in the check, which is the half R-010 turns on.

  R-011:
    status: absent
    note: >-
      Nothing here about ports, onboarding or contradiction passes: `contradict`, `precedence`,
      `onboarding` and `whole-file pass` return zero hits across AGENTS.md, CLAUDE.md, README.md and
      the three process files under docs/agents/. This project has been the source of ported process
      rather than a recipient, so the rule has had no occasion to be written — which is precisely the
      condition under which an absence goes unnoticed.

  R-012:
    status: partial
    where:
      - "docs/agents/collaboration.md § \"Memory is not versioned, and nothing expires it\" — the
        store, the three shapes an entry takes, the write-side rule, the sweep on the change that
        invalidates, and the handover clause (#947)"
      - "AGENTS.md § Working Rules — a fact this repository can carry goes in this repository; a
        durable statement carries the command rather than the fact it answers; and a session that
        finds the tree contradicting a memory says so"
      - "docs/agents/backlog-review.md, and docs/agents/collaboration.md § \"Keeping this file
        honest\" — the backstop sweep, keyed to the process commits of the review period"
    gap: >-
      **The store has never been enumerated once, and #947 put that out of scope on purpose** so the
      rule was not written to justify whatever an audit happened to find. What is written catches a
      change *going forward*: the person landing a process change sweeps for what it retired, with a
      backlog-review backstop. **Nothing establishes a baseline over the entries standing today**,
      and a rule that only catches future changes does not make a store correct that was never
      reconciled. A port would have to add the first enumeration, and the card's onboarding half
      with it: our trigger is the invalidating change, and we have no onboarding path because this
      project has been the source of ported process rather than a recipient.
    note: >-
      **The whole-store diff is deliberately not our rule, and this is a departure from the card
      rather than an omission** — argued in the section itself and reported to dev-agent. At 39
      entries "enumerate the memory and diff it against the new process" is a task nobody performs on
      the way to doing something else, and a skipped rule is worse than none because it reads as
      coverage. The card's own evidence points the same way: ohm-sweet-ohm's four stale entries were
      found *during* the change that invalidated them, and darkroom's one by enumerating fifteen,
      which is a store you can enumerate. So the trigger here is the invalidating change, and the
      card's own sentence about its registry — that the mitigation is not diligence but that every
      claim about a project should be generated from something that project publishes — is written in
      as the load-bearing half: a fact this repository can carry does not live only in memory.
      **What no rule here catches is stated rather than glossed**: an entry falsified by something in
      no repository at all — a mandate withdrawn, a convention reversed in conversation — leaves
      nothing to grep, and the section says so and proposes no detector.
      The process mandate itself is still recorded only in agent memory and in dev-agent's
      STANDING.md; **#958 is the issue that gives it a home**, and #947 deliberately did not write it
      into collaboration.md, that being #958's own subject alongside a merge boundary it must correct.
      **This row alone was re-read against dev-agent `10128ad`**, where the card's substance is
      unchanged from `447b5e6` in the header comment above and the only addition is the footer
      licensing a reader to refute it. Every other row still dates from that audit.
      **This `gap:` used to name the two contradictory `docker` entries of 2026-09-07/08 as its
      evidence, and that was the right evidence in the wrong shape.** The wrong entry was removed
      within the hour this file merged, so the sentence was false before any reader reached it, and
      the check it invited left that reader deciding whether the file or the store was wrong (#960).
      **A `gap:` states the shape of what is missing, not a snapshot of what the thing currently
      holds** — here the missing things are a baseline enumeration and an onboarding path, and
      neither is affected by which entries happen to stand. The incident is kept where incidents
      belong, dated, in docs/agents/collaboration.md and docs/agents/backlog-review.md.

  R-013:
    status: partial
    where:
      - ".github/rulesets/README.md § \"And the coverage question is answered by running it, not by
        reading it\", and § \"The red-is-correct window\" — a control whose first green is also its
        first run cannot be distinguished from one incapable of going red, which is why main.json was
        committed against a four-check ruleset on purpose"
      - "docs/agents/collaboration.md § \"Verification, not trust\" — *\"did the assertions pass\" is
        not the check, \"would this have failed if the code were wrong\" is*, the control that passed
        by the blanket rule's exclusion list rather than by the mechanism it claimed to test (#814),
        and the rule that a deliberate breakage goes on a throwaway branch (#891)"
      - "scripts/check-ruleset.mjs — sourceTypeDiagnosis(), whose two branches are planted each way
        in tests/unit/ruleset-drift.test.ts rather than read (#956)"
    gap: >-
      **Two branches of this control have never met the platform, and this entry is where that is
      said rather than absorbed.** The scheduled trigger has never fired: `.github/workflows/
      ruleset-drift.yml` was added on 2026-09-08 and every run of it so far came from
      `pull_request` or `workflow_dispatch`, which is the card's own third instance — a cron that
      fails by not existing produces no run at all, so its symptom is silence and nothing goes red.
      No absence detector exists here either, and the card records that shape as open rather than
      required. And the `source_type` diagnostic's **incident** branch cannot be reached against
      this repository at all: `michalwy/stamporama` is owned by a `User` account, so no organisation
      ruleset can exist over it; its only exercise is a fixture. Both are stated in the code and in
      the pull request that added them, which is what the rule asks for — but stating an unexercised
      branch is not exercising it, and `implemented` would read as though it were.
