services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: stamporama
      POSTGRES_USER: stamporama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stamporama}
    # Postgres 18+ images store the cluster in a major-version-specific subdirectory
    # (/var/lib/postgresql/<major>/docker) and refuse to start when a pre-18 cluster is
    # found at /var/lib/postgresql/data. Mount the parent directory instead, which is the
    # layout the image documents and which keeps future pg_upgrade --link inside one mount.
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stamporama"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
      args:
        STAMPORAMA_VERSION: ${STAMPORAMA_VERSION:-dev}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://stamporama:${POSTGRES_PASSWORD:-stamporama}@db:5432/stamporama
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Encrypts stored third-party credentials at rest (#476) — the Allegro client secret and
      # OAuth tokens. Listed here because this stack enumerates its environment explicitly, unlike
      # the production one, which reads .env wholesale.
      #
      # A **fixed local default**, exactly as POSTGRES_PASSWORD above: this file only ever runs the
      # local stack, and a dev database holds a sandbox marketplace connection at most. Without one,
      # connecting Allegro locally would need a .env that nothing else about local dev needs.
      #
      # It is deliberately *not* defaulted in `secret-box.ts`: a production install that forgets the
      # variable must fail loudly on the Settings tab rather than quietly seal its real credentials
      # under a key published in this repository.
      STAMPORAMA_SECRET_KEY: ${STAMPORAMA_SECRET_KEY:-stamporama-local-dev-key-not-for-production}
      STAMPORAMA_VERSION: ${STAMPORAMA_VERSION:-dev}
    command: sh -c "pnpm exec prisma migrate deploy && pnpm start"
    # Persist uploaded photo bytes (#112) written under STAMPORAMA_DATA_DIR (default /data)
    # so they survive container rebuilds, matching the production stack. The hot-reload dev
    # overlay runs with NODE_ENV=development and writes to ./.data on the bind-mounted repo
    # instead, so this volume only applies to the built-image local stack.
    volumes:
      - stamporama-data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  stamporama-data:
